[mod-name]
quidquid-blueprints=Quidquid: Blueprints

[mod-description]
quidquid-blueprints=Adds blueprint search to the Quidquid palette: blueprints, books and planners in the inventory and the blueprint library, to hold, copy or export.

[controls]
quidquid-hold-blueprint=Hold blueprint
quidquid-copy-blueprint=Copy blueprint to inventory
quidquid-export-blueprint=Export blueprint string

[mod-setting-name]
quidquid-blueprints-default-search=Include blueprints in the default search

[mod-setting-description]
quidquid-blueprints-default-search=List blueprints in Quidquid's search without restricting it to blueprints. When off, they appear only in a search restricted to them.

