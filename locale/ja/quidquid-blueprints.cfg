[mod-name]
quidquid-blueprints=Quidquid: Blueprints

[mod-description]
quidquid-blueprints=Quidquidのパレットで建設計画を検索できるようにします。インベントリと建設計画ライブラリの建設計画・ブック・プランナーを、手に持つ・コピーする・コードをエクスポートすることができます。

[controls]
quidquid-hold-blueprint=建設計画を手に持つ
quidquid-copy-blueprint=建設計画をインベントリにコピー
quidquid-export-blueprint=建設計画のコードをエクスポート

[mod-setting-name]
quidquid-blueprints-default-search=建設計画を標準の検索に含める

[mod-setting-description]
quidquid-blueprints-default-search=検索対象を絞り込まなくても、Quidquidの検索に建設計画を表示します。オフにすると、建設計画に絞り込んだ検索でのみ表示されます。

[quidquid-blueprints]
source-blueprints=建設計画
cancel-tooltip=キャンセル(__CONTROL__toggle-menu__)

action-hold-blueprint=手に持つ
action-hold-blueprint-hint=__CONTROL__quidquid-hold-blueprint__
action-copy-blueprint=インベントリにコピー
action-copy-blueprint-hint=__CONTROL__quidquid-copy-blueprint__
action-blueprint-unavailable=__1__ __2__はもうありません
action-blueprint-cursor-busy=__1__ __2__を持つためにカーソルを空にできません
action-blueprint-hold-failed=__1__ __2__を手に持てませんでした
action-blueprint-held=__1__ __2__を手に持ちました
action-blueprint-copied=__1__ __2__をインベントリにコピーしました
action-blueprint-no-inventory=__1__ __2__を入れるインベントリがありません
action-blueprint-inventory-full=__1__ __2__を入れる空きスロットがありません
action-blueprint-import-failed=__1__ __2__をコピーできませんでした
action-export-blueprint=コードをエクスポート
action-export-blueprint-hint=__CONTROL__quidquid-export-blueprint__
blueprint-export-copy-hint=選択されたテキストをコピーしてください。
